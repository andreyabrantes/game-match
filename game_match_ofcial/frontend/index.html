<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Match - Login / Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style-game-match.css">
</head>

<body class="auth-page-body">
    <div class="auth-container">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-neon-green flex items-center justify-center gap-3">
                <i class="fas fa-gamepad"></i> Game Match
            </h1>
        </div>

        <div class="flex justify-center mb-8 border-b border-border-color">
            <button id="login-tab" class="tab-button active">Login</button>
            <button id="register-tab" class="tab-button">Cadastro</button>
        </div>

        <form id="login-form" class="form-visible">
            <div class="space-y-5">
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="login-email" placeholder="E-mail" class="input-field-icon" required>
                </div>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="login-password" placeholder="Senha" class="input-field-icon" required>
                    <i class="fas fa-eye password-toggle" id="password-toggle-login"></i>
                </div>
            </div>

            <div class="text-right mt-4 mb-6">
                <a href="#" id="forgot-password-link" class="text-sm text-neon-blue hover:underline">Esqueci minha
                    senha</a>
            </div>

            <p id="login-error-message" class="error-message hidden mb-4"></p>

            <button type="submit" id="login-submit-button" class="btn-primary w-full">Entrar</button>

            <div class="separator">Ou continue com</div>

            <div class="space-y-3">
                <button type="button" id="google-login-btn" class="social-login-btn google">
                    <i class="fab fa-google text-xl"></i> Login com Google
                </button>
                <button type="button" id="discord-login-btn" class="social-login-btn discord">
                    <i class="fab fa-discord text-xl"></i> Login com Discord
                </button>
            </div>
        </form>

        <form id="register-form" class="hidden">
            <div class="space-y-5">
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="register-email" placeholder="E-mail" class="input-field-icon" required>
                </div>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="register-username" placeholder="Nome de Usuário" class="input-field-icon"
                        required>
                </div>
                <div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="register-password" placeholder="Crie uma senha"
                            class="input-field-icon" required>
                        <i class="fas fa-eye password-toggle" id="password-toggle-register"></i>
                    </div>
                    <div class="mt-2">
                        <div id="password-strength-meter" class="w-full bg-accent-dark-bg rounded-full h-2.5">
                            <div id="password-strength-bar" class="h-2.5 rounded-full transition-all duration-300"
                                style="width: 0%"></div>
                        </div>
                        <p id="password-strength-text" class="text-xs text-center text-text-medium-gray mt-1"></p>
                    </div>
                </div>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="register-confirm-password" placeholder="Confirmar Senha"
                        class="input-field-icon" required>
                </div>
                <div>
                    <label for="register-platform"
                        class="block text-left text-sm font-semibold mb-2 text-text-medium-gray">Plataforma
                        Principal:</label>
                    <select id="register-platform" class="input-field bg-accent-dark-bg text-text-light-gray w-full"
                        required>
                        <option value="">Selecione a Plataforma</option>
                        <option value="PC">PC</option>
                        <option value="PS5">PS5</option>
                        <option value="Xbox Series X/S">Xbox Series X/S</option>
                        <option value="Nintendo Switch">Nintendo Switch</option>
                        <option value="Mobile">Mobile</option>
                        <option value="PS4">PS4</option>
                        <option value="Xbox One">Xbox One</option>
                    </select>
                </div>
                <div>
                    <label class="block text-left text-sm font-semibold mb-2 text-text-medium-gray">Jogos Favoritos
                        (selecione até 5):</label>
                    <div id="favorite-games-select" class="select-multiple"></div>
                </div>
            </div>
            <p id="register-error-message" class="error-message hidden mt-4"></p>
            <button type="submit" id="register-submit-button" class="btn-primary w-full mt-6">Cadastrar</button>
        </form>
    </div>

    <script type="module" src="script.js" defer></script>
</body>

</html>
